<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Penalty Kick Simulator Pro</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* 1. Scoreboard HUD */
    .score-hud {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 20px;
      padding: 8px 20px;
      color: #fff;
      z-index: 999;
      display: flex;
      gap: 15px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .score-box { text-align: center; }
    .score-title { font-size: 10px; color: #94a3b8; font-weight: bold; }
    .score-val { font-size: 18px; font-weight: 800; color: #38bdf8; }

    /* 2. Notification Banner (Goal / Saved) */
    .status-banner {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 16px;
      color: white;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .bg-goal { background: #22c55e; }
    .bg-saved { background: #ef4444; }

    /* 3. Kick Button */
    .kick-btn-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }
    .kick-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: 3px solid #ffffff;
      padding: 14px 45px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
      transition: all 0.1s ease;
    }
    .kick-btn:active { transform: scale(0.92); }
    .kick-btn:disabled { background: #64748b; border-color: #94a3b8; box-shadow: none; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="score-hud">
    <div class="score-box">
      <div class="score-title">GOALS</div>
      <div class="score-val" id="goals-count" style="color: #4ade80;">0</div>
    </div>
    <div style="border-left: 1px solid #334155;"></div>
    <div class="score-box">
      <div class="score-title">SAVED</div>
      <div class="score-val" id="saved-count" style="color: #f87171;">0</div>
    </div>
  </div>

  <div class="status-banner" id="status-banner">GOAL!</div>

  <div class="kick-btn-container">
    <button class="kick-btn" id="kick-btn" onclick="startPenaltyKick()">KICK!</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-entity light="type: ambient; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; intensity: 1.2; position: 1 4 2"></a-entity>

    <a-marker preset="hiro" id="hiro-marker">
      
      <a-plane position="0 0 -0.8" rotation="-90 0 0" width="1.6" height="2.2" color="#15803d"></a-plane>
      <a-plane position="0 0.001 -0.8" rotation="-90 0 0" width="1.5" height="2.1" color="#16a34a"></a-plane>
      <a-ring position="0 0.002 0.1" rotation="-90 0 0" radius-inner="0.29" radius-outer="0.3" color="#ffffff"></a-ring>
      
      <a-entity id="goal-post" position="0 0 -1.6">
        <a-cylinder position="-0.65 0.45 0" radius="0.02" height="0.9" color="#ffffff"></a-cylinder>
        <a-cylinder position="0.65 0.45 0" radius="0.02" height="0.9" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.9 0" radius="0.02" height="1.32" color="#ffffff" rotation="0 0 90"></a-cylinder>
        <a-plane position="0 0.45 -0.2" width="1.3" height="0.9" color="#e2e8f0" opacity="0.4" material="wireframe: true"></a-plane>
      </a-entity>

      <a-entity id="goalkeeper" position="0 0 -1.55">
        <a-box position="0 0.45 0" width="0.22" height="0.35" depth="0.12" color="#ef4444"></a-box>
        <a-sphere position="0 0.7 0" radius="0.09" color="#fca5a5"></a-sphere>
        <a-sphere id="glove-left" position="-0.16 0.45 0.05" radius="0.05" color="#f59e0b"></a-sphere>
        <a-sphere id="glove-right" position="0.16 0.45 0.05" radius="0.05" color="#f59e0b"></a-sphere>
        <a-cylinder position="-0.06 0.15 0" radius="0.04" height="0.3" color="#1e293b"></a-cylinder>
        <a-cylinder position="0.06 0.15 0" radius="0.04" height="0.3" color="#1e2
